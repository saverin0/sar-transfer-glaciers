[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sartransfer"
version = "1.0.0"
description = "Do frozen photo- and satellite-pretrained encoders transfer to SAR? Glacier calving fronts on CaFFe."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# What the code imports. Google Colab ships all of these; the notebooks install
# the encoder-specific extras below at run time when they are missing.
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "matplotlib",
    "psutil",
    "torch",
    "transformers",
    "huggingface_hub",
]

[project.optional-dependencies]
radio = ["timm", "einops", "open_clip_torch"]       # C-RADIOv4-H remote code
terramind = ["terratorch"]                           # TerraMind
viz = ["fiftyone"]                                   # FiftyOne viewer: notebook 10, scripts/
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff's classic default set, pinned here because newer ruff versions enable a
# much larger default set and CI installs whatever version is current.
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E741"]   # one-liners and `l` as a name are style, not errors

[tool.ruff.lint.per-file-ignores]
"src/sartransfer/models/anyup/**" = ["ALL"]   # vendored, kept as published

[tool.pytest.ini_options]
pythonpath = ["src"]   # tests import the package from src/ without installing it
