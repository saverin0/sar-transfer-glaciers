name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install ruff pytest
      - run: ruff check src scripts sync.py
      - run: python -m compileall -q src scripts sync.py
      - run: pytest tests/
